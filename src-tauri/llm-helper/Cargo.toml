# ADVERSUM: the local language model for sentences the rules cannot read.
#
# A program of its own, not part of the app's binary: llama.cpp and
# whisper.cpp (speech, in the app) each bring their own copy of the ggml
# library, and one binary cannot hold both. The app starts this helper when
# it needs it and talks to it through pipes (see src/main.rs).
[package]
name = "kimaitray-llm"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
llama-cpp-2 = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "0.1", default-features = false, features = ["metal"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
